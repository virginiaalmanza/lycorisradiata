a su legendario papel como guía para las almas en su tránsito final, la Lycoris radiata sirve como un poderoso recordatorio de la transitoriedad de la vida.<br /><br />No obstante, limitar su interpretación a la tristeza y la pérdida sería pasar por alto su naturaleza dual. Esta flor también encarna conceptos de transformación, reencarnación y la belleza efímera que se encuentra en los finales.</td></tr></table>";B+="</span>";B+="</div>";B+="<div id=\"C4\">";B+="<span id=\"C4L0\" >";if(IE>-1&&IE<9){B+="<v:image id=\"C4L0S3\" class=\"V1\" "+MouseDown+"=\"this.src=MF+'home.png';\" "+MouseClick+"=\"this.src=MF+'home.png';F7();return F16(event);\" onmouseout=\"this.src=MF+'home.png';\" ></v:image>";}else{B+="<img id=\"C4L0S3\" class=\"V1\" "+MouseDown+"=\"this.src=MF+'home.png';\" "+MouseClick+"=\"this.src=MF+'home.png';F7();return F16(event);\" onmouseout=\"this.src=MF+'home.png';\" />";}B+="<table id=\"C4L0S2\"><tr><td class=\"V4\">La Lycoris radiata es venenosa. Todas las partes de la planta contienen el alcaloide tóxico licorina, siendo el bulbo la parte más peligrosa al ser consumido. Esta planta es tóxica para los humanos y puede causar efectos adversos si se ingiere, aunque la severidad de la toxicidad es baja. Además, se ha cultivado para evitar que los roedores excaven en los restos mortales, lo que indica su uso como planta venenosa. <br /></td></tr></table>";B+="<table id=\"C4L0S1\"><tr><td class=\"V4\">Una de las leyendas más conocidas cuenta que la diosa del sol Amaterasu encargó a los elfos Manjû y Saka cuidar de la flor. Los elfos se enamoraron, y como castigo, la diosa maldijo la flor: si las hojas crecían, la flor se marchitaba, y si la flor florecía, las hojas caían. Esto simboliza la separación eterna de los amantes y explica el ciclo peculiar de la planta.</td></tr></table>";B+="<table id=\"C4L0S0\"><tr><td class=\"V4\">Se cree que guía a las almas al inframundo o que crece en el camino hacia la reencarnación,sirviendo como último recuerdo de la vida
